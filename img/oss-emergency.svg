<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="院前急救多模态评分 封面">
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161206"/><stop offset="1" stop-color="#0c0e18"/>
    </linearGradient>
    <radialGradient id="e-glow" cx="20%" cy="10%" r="70%">
      <stop offset="0" stop-color="#f5b451" stop-opacity=".20"/><stop offset="1" stop-color="#f5b451" stop-opacity="0"/>
    </radialGradient>
    <pattern id="e-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="640" height="300" fill="url(#e-bg)"/>
  <rect width="640" height="300" fill="url(#e-grid)"/>
  <rect width="640" height="300" fill="url(#e-glow)"/>
  <!-- vision: tracked figures with bounding boxes -->
  <g transform="translate(60 70)">
    <g stroke="#f5b451" stroke-width="2">
      <rect x="0" y="18" width="70" height="120" rx="6" fill="#f5b451" fill-opacity=".05"/>
      <rect x="88" y="6" width="70" height="132" rx="6" fill="#f5b451" fill-opacity=".05"/>
      <rect x="176" y="24" width="70" height="114" rx="6" fill="#f5b451" fill-opacity=".05"/>
    </g>
    <g fill="#f5b451" font-family="ui-monospace,Menlo,monospace" font-size="10">
      <text x="2" y="12">ID·1</text><text x="90" y="0" dy="0">ID·2</text><text x="178" y="18">ID·3</text>
    </g>
    <!-- simple person glyphs -->
    <g fill="#fbd38d" fill-opacity=".8">
      <circle cx="35" cy="46" r="11"/><rect x="24" y="62" width="22" height="60" rx="8"/>
      <circle cx="123" cy="34" r="11"/><rect x="112" y="50" width="22" height="66" rx="8"/>
      <circle cx="211" cy="52" r="11"/><rect x="200" y="68" width="22" height="56" rx="8"/>
    </g>
  </g>
  <!-- audio waveform -->
  <g transform="translate(340 150)" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-opacity=".8">
    <line x1="0" y1="-10" x2="0" y2="10"/><line x1="14" y1="-26" x2="14" y2="26"/><line x1="28" y1="-16" x2="28" y2="16"/>
    <line x1="42" y1="-40" x2="42" y2="40"/><line x1="56" y1="-22" x2="56" y2="22"/><line x1="70" y1="-34" x2="70" y2="34"/>
    <line x1="84" y1="-12" x2="84" y2="12"/><line x1="98" y1="-28" x2="98" y2="28"/><line x1="112" y1="-18" x2="112" y2="18"/>
    <line x1="126" y1="-38" x2="126" y2="38"/><line x1="140" y1="-14" x2="140" y2="14"/>
  </g>
  <!-- unified timeline -->
  <g transform="translate(60 236)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#ffffff" stroke-opacity=".16"/>
    <g fill="#f5b451"><circle cx="70" cy="0" r="4"/><circle cx="200" cy="0" r="4"/></g>
    <g fill="#38bdf8"><circle cx="330" cy="0" r="4"/><circle cx="440" cy="0" r="4"/></g>
  </g>
  <text x="60" y="52" fill="#fbd38d" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">VIDEO · AUDIO · MULTIMODAL</text>
</svg>
