<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="ui-sans-serif,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="高可用物理拓扑 架构图">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161206"/><stop offset="1" stop-color="#0a0f1b"/></linearGradient>
    <pattern id="p-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <marker id="p-ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#a07f3a"/></marker>
  </defs>
  <rect width="1000" height="430" fill="url(#p-bg)"/>
  <rect width="1000" height="430" fill="url(#p-grid)"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#f4f8fd">高可用物理拓扑 · 2022</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#9fb0c3">阿里云 + IDC 混合云 · 多地域多集群 · 网关层与安全域</text>

  <!-- Aliyun column -->
  <g>
    <rect x="120" y="80" width="360" height="330" rx="14" fill="#38bdf8" fill-opacity=".045" stroke="#38bdf8" stroke-opacity=".28"/>
    <rect x="132" y="72" width="96" height="20" rx="10" fill="#0e1626" stroke="#38bdf8" stroke-opacity=".45"/><text x="180" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">阿里云侧</text>
    <g font-size="13" fill="#e6edf5" text-anchor="middle">
      <rect x="140" y="104" width="320" height="44" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="300" y="131">DNS · CDN 静态回源</text>
      <rect x="140" y="162" width="320" height="44" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="300" y="189">阿里云高防 (DDoS)</text>
      <rect x="140" y="220" width="320" height="44" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="300" y="247">阿里云 SLB 负载均衡</text>
      <rect x="140" y="278" width="320" height="44" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="300" y="305">ECS 应用服务集群</text>
    </g>
    <g stroke="#a07f3a" stroke-width="1.5" fill="none">
      <line x1="300" y1="148" x2="300" y2="161" marker-end="url(#p-ar)"/>
      <line x1="300" y1="206" x2="300" y2="219" marker-end="url(#p-ar)"/>
      <line x1="300" y1="264" x2="300" y2="277" marker-end="url(#p-ar)"/>
    </g>
  </g>

  <!-- IDC column -->
  <g>
    <rect x="560" y="80" width="360" height="330" rx="14" fill="#f5b451" fill-opacity=".05" stroke="#f5b451" stroke-opacity=".32"/>
    <rect x="572" y="72" width="108" height="20" rx="10" fill="#161206" stroke="#f5b451" stroke-opacity=".45"/><text x="626" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#f5c877">IDC 机房</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="580" y="104" width="320" height="40" rx="8" fill="#1b1508" stroke="#f5b451" stroke-opacity=".22"/><text x="740" y="129">IDC 四层防火墙</text>
      <rect x="580" y="152" width="320" height="40" rx="8" fill="#1b1508" stroke="#f5b451" stroke-opacity=".22"/><text x="740" y="177">自研 WAF · 安全域</text>
      <rect x="580" y="200" width="320" height="40" rx="8" fill="#1b1508" stroke="#f5b451" stroke-opacity=".22"/><text x="740" y="225">IDC 核心交换机</text>
      <rect x="580" y="248" width="320" height="40" rx="8" fill="#1b1508" stroke="#f5b451" stroke-opacity=".22"/><text x="740" y="273">数据库服务集群</text>
      <rect x="580" y="296" width="320" height="40" rx="8" fill="#1b1508" stroke="#f5b451" stroke-opacity=".22"/><text x="740" y="321">FC SAN 存储</text>
    </g>
    <g stroke="#a07f3a" stroke-width="1.5" fill="none">
      <line x1="740" y1="144" x2="740" y2="151" marker-end="url(#p-ar)"/>
      <line x1="740" y1="192" x2="740" y2="199" marker-end="url(#p-ar)"/>
      <line x1="740" y1="240" x2="740" y2="247" marker-end="url(#p-ar)"/>
      <line x1="740" y1="288" x2="740" y2="295" marker-end="url(#p-ar)"/>
    </g>
  </g>

  <!-- private line between columns -->
  <g>
    <line x1="460" y1="242" x2="580" y2="242" stroke="#f5b451" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="482" y="222" width="76" height="20" rx="10" fill="#0a0f1b" stroke="#f5b451" stroke-opacity=".4"/><text x="520" y="236" text-anchor="middle" font-size="10.5" fill="#f5c877">专线互联</text>
    <circle cx="460" cy="242" r="3.5" fill="#f5b451"/><circle cx="580" cy="242" r="3.5" fill="#f5b451"/>
  </g>
  <text x="500" y="392" text-anchor="middle" font-size="11" fill="#c9a24a">主备 / 多活容灾 · 抵御 600G DDoS + 15G CC 混合攻击</text>
</svg>
