<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="AI 论文查重 封面">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2c"/><stop offset="1" stop-color="#0a111d"/>
    </linearGradient>
    <radialGradient id="s-glow" cx="18%" cy="8%" r="70%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="640" height="300" fill="url(#s-bg)"/>
  <rect width="640" height="300" fill="url(#s-grid)"/>
  <rect width="640" height="300" fill="url(#s-glow)"/>
  <!-- two documents being compared -->
  <g transform="translate(196 66)">
    <rect x="0" y="0" width="118" height="150" rx="10" fill="#0d1929" stroke="#38bdf8" stroke-opacity=".5"/>
    <rect x="130" y="18" width="118" height="150" rx="10" fill="#0d1929" stroke="#7dd3fc" stroke-opacity=".38"/>
    <g stroke="#38bdf8" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
      <line x1="18" y1="30" x2="90" y2="30"/><line x1="18" y1="52" x2="100" y2="52"/>
      <line x1="18" y1="74" x2="70" y2="74"/><line x1="18" y1="96" x2="96" y2="96"/><line x1="18" y1="118" x2="60" y2="118"/>
    </g>
    <g stroke="#7dd3fc" stroke-opacity=".4" stroke-width="3" stroke-linecap="round">
      <line x1="148" y1="48" x2="220" y2="48"/><line x1="148" y1="70" x2="230" y2="70"/><line x1="148" y1="92" x2="200" y2="92"/><line x1="148" y1="114" x2="226" y2="114"/>
    </g>
    <!-- match links -->
    <g stroke="#f5b451" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="4 4">
      <line x1="90" y1="30" x2="148" y2="48"/><line x1="100" y1="52" x2="148" y2="70"/><line x1="96" y1="96" x2="148" y2="114"/>
    </g>
    <g fill="#f5b451">
      <circle cx="90" cy="30" r="3.4"/><circle cx="148" cy="48" r="3.4"/><circle cx="100" cy="52" r="3.4"/><circle cx="148" cy="70" r="3.4"/>
    </g>
  </g>
  <text x="34" y="50" fill="#7dd3fc" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">SIMILARITY · VECTOR</text>
</svg>
