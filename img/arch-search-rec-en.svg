<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Search and recommendation strategy and model infrastructure architecture">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a18"/><stop offset="1" stop-color="#0a0f1b"/></linearGradient>
    <pattern id="sr-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <marker id="sr-ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5b8079"/></marker>
    <marker id="sr-ar-g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1000" height="560" fill="url(#sr-bg)"/>
  <rect width="1000" height="560" fill="url(#sr-grid)"/>
  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f4f8fd">Search · Recommendation · Strategy &amp; Model Infra</text>
  <text x="500" y="63" text-anchor="middle" font-size="12" fill="#9fb0c3">Multi-recall → coarse → fine → rerank · feature platform + model serving + A/B testing</text>

  <!-- LEFT: data engineering -->
  <g>
    <rect x="18" y="96" width="104" height="404" rx="12" fill="#0c1a20" stroke="#22d3ee" stroke-opacity=".38"/>
    <text x="70" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#67e8f9">Data Eng</text>
    <g font-size="10" fill="#c6eef5" text-anchor="middle">
      <rect x="28" y="134" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="152">Behavior logs</text><text x="70" y="166" font-size="9" fill="#7fd8e6">Kafka</text>
      <rect x="28" y="184" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="202">Realtime</text><text x="70" y="216" font-size="9" fill="#7fd8e6">Flink</text>
      <rect x="28" y="234" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="252">Offline DW</text><text x="70" y="266" font-size="9" fill="#7fd8e6">Hive / Spark</text>
      <rect x="28" y="284" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="302">Samples</text><text x="70" y="316" font-size="9" fill="#7fd8e6">impr / click</text>
      <rect x="28" y="334" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="352">Index build</text><text x="70" y="366" font-size="9" fill="#7fd8e6">Canal CDC</text>
    </g>
    <text x="70" y="402" text-anchor="middle" font-size="10" fill="#7fd8e6">Feeds</text>
    <text x="70" y="417" text-anchor="middle" font-size="9.5" fill="#c6eef5">ES / Milvus</text>
    <text x="70" y="431" text-anchor="middle" font-size="9.5" fill="#c6eef5">features / samples</text>
    <line x1="122" y1="250" x2="134" y2="250" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#sr-ar)"/>
    <line x1="122" y1="405" x2="134" y2="405" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#sr-ar)"/>
  </g>

  <!-- application -->
  <g>
    <rect x="140" y="96" width="724" height="68" rx="12" fill="#34d399" fill-opacity=".05" stroke="#34d399" stroke-opacity=".28"/>
    <rect x="152" y="88" width="120" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".4"/><text x="212" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">Apps / Scenarios</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="235" y="139">Search</text>
      <rect x="334" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="419" y="139">Item Recs</text>
      <rect x="518" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="603" y="139">Content Recs</text>
      <rect x="702" y="114" width="160" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="782" y="139">Personalization</text>
    </g>
  </g>
  <line x1="500" y1="164" x2="500" y2="178" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- recall -->
  <g>
    <rect x="140" y="180" width="724" height="76" rx="12" fill="#34d399" fill-opacity=".05" stroke="#34d399" stroke-opacity=".28"/>
    <rect x="152" y="172" width="164" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".4"/><text x="234" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">Recall · Multi-recall</text>
    <g font-size="11.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="235" y="220">Inverted</text><text x="235" y="236" font-size="9.5" fill="#9fb0c3">Elasticsearch</text>
      <rect x="334" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="419" y="220">Vector</text><text x="419" y="236" font-size="9.5" fill="#9fb0c3">Milvus / ANN</text>
      <rect x="518" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="603" y="220">Collaborative</text><text x="603" y="236" font-size="9.5" fill="#9fb0c3">i2i / u2i</text>
      <rect x="702" y="200" width="160" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="782" y="220">Hot / Rules</text><text x="782" y="236" font-size="9.5" fill="#9fb0c3">operations</text>
    </g>
  </g>
  <line x1="500" y1="256" x2="500" y2="270" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- ranking pipeline -->
  <g>
    <rect x="140" y="272" width="724" height="82" rx="12" fill="#34d399" fill-opacity=".06" stroke="#34d399" stroke-opacity=".34"/>
    <rect x="152" y="264" width="128" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".45"/><text x="216" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">Ranking · Funnel</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="158" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="256" y="316">Coarse rank</text><text x="256" y="332" font-size="9.5" fill="#9fd6c0">lightweight / two-tower</text>
      <rect x="402" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="500" y="316">Fine rank</text><text x="500" y="332" font-size="9.5" fill="#9fd6c0">DNN / GBDT</text>
      <rect x="646" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="744" y="316">Rerank</text><text x="744" y="332" font-size="9.5" fill="#9fd6c0">diversity / rules</text>
    </g>
    <line x1="354" y1="319" x2="400" y2="319" stroke="#34d399" stroke-width="1.8" marker-end="url(#sr-ar-g)"/>
    <line x1="598" y1="319" x2="644" y2="319" stroke="#34d399" stroke-width="1.8" marker-end="url(#sr-ar-g)"/>
  </g>
  <line x1="500" y1="354" x2="500" y2="368" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- feature & model -->
  <g>
    <rect x="140" y="370" width="724" height="80" rx="12" fill="#818cf8" fill-opacity=".05" stroke="#818cf8" stroke-opacity=".3"/>
    <rect x="152" y="362" width="140" height="20" rx="10" fill="#0a0f1b" stroke="#818cf8" stroke-opacity=".45"/><text x="222" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#a5b4fc">Feature &amp; Model</text>
    <g font-size="12" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="392" width="232" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="266" y="413">Feature Platform</text><text x="266" y="429" font-size="9" fill="#aab0d8">profile / behavior / context</text>
      <rect x="396" y="392" width="232" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="512" y="413">Model Serving</text><text x="512" y="429" font-size="9" fill="#aab0d8">LR / GBDT / DNN / two-tower</text>
      <rect x="642" y="392" width="220" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="752" y="413">Online-Offline</text><text x="752" y="429" font-size="9" fill="#aab0d8">feature store / consistency</text>
    </g>
  </g>

  <!-- RIGHT: experiment & monitor -->
  <g>
    <rect x="878" y="96" width="104" height="404" rx="12" fill="#1a1406" stroke="#f5b451" stroke-opacity=".38"/>
    <text x="930" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#f5c877">Experiment</text>
    <g font-size="10" fill="#f3e2c4" text-anchor="middle">
      <rect x="888" y="134" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="153">A / B Test</text><text x="930" y="167" font-size="9" fill="#d9b877">split</text>
      <rect x="888" y="186" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="205">Metrics</text><text x="930" y="219" font-size="9" fill="#d9b877">CTR / CVR</text>
      <rect x="888" y="238" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="257">Monitor</text><text x="930" y="271" font-size="9" fill="#d9b877">effect / latency</text>
      <rect x="888" y="290" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="309">Model Iter</text><text x="930" y="323" font-size="9" fill="#d9b877">retrain</text>
    </g>
    <g stroke="#c08a2e" stroke-width="1.5" fill="none">
      <line x1="930" y1="176" x2="930" y2="185" marker-end="url(#sr-ar)"/>
      <line x1="930" y1="228" x2="930" y2="237" marker-end="url(#sr-ar)"/>
      <line x1="930" y1="280" x2="930" y2="289" marker-end="url(#sr-ar)"/>
      <path d="M972 311 q10 0 10 -20 V166 q0 -20 -10 -20" stroke="#f5b451" stroke-opacity=".7" stroke-dasharray="5 5" marker-end="url(#sr-ar)"/>
    </g>
    <text x="930" y="362" text-anchor="middle" font-size="9.5" fill="#d9b877">Data / effect</text>
    <text x="930" y="377" text-anchor="middle" font-size="9.5" fill="#f3e2c4">drive tuning</text>
  </g>
  <path d="M864 319 H872 q6 0 6 -12 V158" fill="none" stroke="#8a6a3a" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#sr-ar)"/>
</svg>
