<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="ui-sans-serif,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="搜索推荐策略与模型基础建设架构图">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a18"/><stop offset="1" stop-color="#0a0f1b"/></linearGradient>
    <pattern id="sr-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <marker id="sr-ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5b8079"/></marker>
    <marker id="sr-ar-g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1000" height="560" fill="url(#sr-bg)"/>
  <rect width="1000" height="560" fill="url(#sr-grid)"/>
  <text x="500" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#f4f8fd">搜索 · 推荐 · 策略与模型基础建设</text>
  <text x="500" y="63" text-anchor="middle" font-size="13" fill="#9fb0c3">多路召回 → 粗排 → 精排 → 重排 · 特征平台 + 模型服务 + A/B 实验</text>

  <!-- LEFT: data engineering -->
  <g>
    <rect x="18" y="96" width="104" height="404" rx="12" fill="#0c1a20" stroke="#22d3ee" stroke-opacity=".38"/>
    <text x="70" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#67e8f9">数据工程</text>
    <g font-size="10.5" fill="#c6eef5" text-anchor="middle">
      <rect x="28" y="134" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="152">行为日志</text><text x="70" y="166" font-size="9" fill="#7fd8e6">Kafka</text>
      <rect x="28" y="184" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="202">实时计算</text><text x="70" y="216" font-size="9" fill="#7fd8e6">Flink</text>
      <rect x="28" y="234" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="252">离线数仓</text><text x="70" y="266" font-size="9" fill="#7fd8e6">Hive / Spark</text>
      <rect x="28" y="284" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="302">样本 / 标注</text><text x="70" y="316" font-size="9" fill="#7fd8e6">曝光/点击</text>
      <rect x="28" y="334" width="84" height="40" rx="7" fill="#0f2028" stroke="#22d3ee" stroke-opacity=".28"/><text x="70" y="352">索引构建</text><text x="70" y="366" font-size="9" fill="#7fd8e6">Canal CDC</text>
    </g>
    <text x="70" y="400" text-anchor="middle" font-size="10" fill="#7fd8e6">供给</text>
    <text x="70" y="416" text-anchor="middle" font-size="9.5" fill="#c6eef5">ES / Milvus</text>
    <text x="70" y="430" text-anchor="middle" font-size="9.5" fill="#c6eef5">特征 / 样本</text>
    <line x1="122" y1="250" x2="134" y2="250" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#sr-ar)"/>
    <line x1="122" y1="405" x2="134" y2="405" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#sr-ar)"/>
  </g>

  <!-- MAIN bands -->
  <!-- application -->
  <g>
    <rect x="140" y="96" width="724" height="68" rx="12" fill="#34d399" fill-opacity=".05" stroke="#34d399" stroke-opacity=".28"/>
    <rect x="152" y="88" width="96" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".4"/><text x="200" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">应用 / 场景</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="235" y="139">搜索</text>
      <rect x="334" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="419" y="139">商品推荐</text>
      <rect x="518" y="114" width="170" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="603" y="139">内容推荐</text>
      <rect x="702" y="114" width="160" height="40" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="782" y="139">千人千面</text>
    </g>
  </g>
  <line x1="500" y1="164" x2="500" y2="178" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- recall -->
  <g>
    <rect x="140" y="180" width="724" height="76" rx="12" fill="#34d399" fill-opacity=".05" stroke="#34d399" stroke-opacity=".28"/>
    <rect x="152" y="172" width="150" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".4"/><text x="227" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">召回层 · 多路召回</text>
    <g font-size="11.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="235" y="220">倒排召回</text><text x="235" y="236" font-size="9.5" fill="#9fb0c3">Elasticsearch</text>
      <rect x="334" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="419" y="220">向量召回</text><text x="419" y="236" font-size="9.5" fill="#9fb0c3">Milvus / ANN</text>
      <rect x="518" y="200" width="170" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="603" y="220">协同过滤</text><text x="603" y="236" font-size="9.5" fill="#9fb0c3">i2i / u2i</text>
      <rect x="702" y="200" width="160" height="46" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="782" y="220">热门 / 规则</text><text x="782" y="236" font-size="9.5" fill="#9fb0c3">运营策略</text>
    </g>
  </g>
  <line x1="500" y1="256" x2="500" y2="270" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- ranking pipeline -->
  <g>
    <rect x="140" y="272" width="724" height="82" rx="12" fill="#34d399" fill-opacity=".06" stroke="#34d399" stroke-opacity=".34"/>
    <rect x="152" y="264" width="120" height="20" rx="10" fill="#0a0f1b" stroke="#34d399" stroke-opacity=".45"/><text x="212" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">排序层 · 漏斗</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="158" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="256" y="316">粗排</text><text x="256" y="332" font-size="9.5" fill="#9fd6c0">轻量模型 / 双塔</text>
      <rect x="402" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="500" y="316">精排</text><text x="500" y="332" font-size="9.5" fill="#9fd6c0">DNN / GBDT</text>
      <rect x="646" y="296" width="196" height="46" rx="8" fill="#10231d" stroke="#34d399" stroke-opacity=".35"/><text x="744" y="316">重排</text><text x="744" y="332" font-size="9.5" fill="#9fd6c0">多样性 / 业务规则</text>
    </g>
    <line x1="354" y1="319" x2="400" y2="319" stroke="#34d399" stroke-width="1.8" marker-end="url(#sr-ar-g)"/>
    <line x1="598" y1="319" x2="644" y2="319" stroke="#34d399" stroke-width="1.8" marker-end="url(#sr-ar-g)"/>
  </g>
  <line x1="500" y1="354" x2="500" y2="368" stroke="#5b8079" stroke-width="1.6" marker-end="url(#sr-ar)"/>

  <!-- feature & model -->
  <g>
    <rect x="140" y="370" width="724" height="80" rx="12" fill="#818cf8" fill-opacity=".05" stroke="#818cf8" stroke-opacity=".3"/>
    <rect x="152" y="362" width="132" height="20" rx="10" fill="#0a0f1b" stroke="#818cf8" stroke-opacity=".45"/><text x="218" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#a5b4fc">特征 &amp; 模型</text>
    <g font-size="12" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="392" width="232" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="266" y="413">特征平台</text><text x="266" y="429" font-size="9.5" fill="#aab0d8">用户画像 / 行为 / 上下文</text>
      <rect x="396" y="392" width="232" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="512" y="413">模型服务</text><text x="512" y="429" font-size="9.5" fill="#aab0d8">LR / GBDT / DNN / 双塔</text>
      <rect x="642" y="392" width="220" height="48" rx="8" fill="#12142a" stroke="#818cf8" stroke-opacity=".25"/><text x="752" y="413">在离线一致</text><text x="752" y="429" font-size="9.5" fill="#aab0d8">特征存储 / 一致性</text>
    </g>
  </g>

  <!-- RIGHT: experiment & monitor -->
  <g>
    <rect x="878" y="96" width="104" height="404" rx="12" fill="#1a1406" stroke="#f5b451" stroke-opacity=".38"/>
    <text x="930" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#f5c877">实验 / 监控</text>
    <g font-size="10.5" fill="#f3e2c4" text-anchor="middle">
      <rect x="888" y="134" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="153">A / B 实验</text><text x="930" y="167" font-size="9" fill="#d9b877">分流 / 置信</text>
      <rect x="888" y="186" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="205">核心指标</text><text x="930" y="219" font-size="9" fill="#d9b877">CTR / CVR</text>
      <rect x="888" y="238" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="257">监控告警</text><text x="930" y="271" font-size="9" fill="#d9b877">效果 / 时延</text>
      <rect x="888" y="290" width="84" height="42" rx="7" fill="#221a08" stroke="#f5b451" stroke-opacity=".3"/><text x="930" y="309">模型迭代</text><text x="930" y="323" font-size="9" fill="#d9b877">回流 / 训练</text>
    </g>
    <g stroke="#c08a2e" stroke-width="1.5" fill="none">
      <line x1="930" y1="176" x2="930" y2="185" marker-end="url(#sr-ar)"/>
      <line x1="930" y1="228" x2="930" y2="237" marker-end="url(#sr-ar)"/>
      <line x1="930" y1="280" x2="930" y2="289" marker-end="url(#sr-ar)"/>
      <path d="M972 311 q10 0 10 -20 V166 q0 -20 -10 -20" stroke="#f5b451" stroke-opacity=".7" stroke-dasharray="5 5" marker-end="url(#sr-ar)"/>
    </g>
    <text x="930" y="360" text-anchor="middle" font-size="9.5" fill="#d9b877">数据 / 效果</text>
    <text x="930" y="375" text-anchor="middle" font-size="9.5" fill="#f3e2c4">驱动策略优化</text>
  </g>
  <!-- link ranking -> experiment -->
  <path d="M864 319 H872 q6 0 6 -12 V158" fill="none" stroke="#8a6a3a" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#sr-ar)"/>
</svg>
