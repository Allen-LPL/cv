<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Distributed architecture case diagram">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#0a0f1b"/></linearGradient>
    <pattern id="d-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <marker id="d-ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5b7089"/></marker>
    <marker id="d-ar-c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1000" height="440" fill="url(#d-bg)"/>
  <rect width="1000" height="440" fill="url(#d-grid)"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#f4f8fd">Distributed Architecture Case · 2019</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Early toC evolution · service split / caching / R-W splitting / monitoring</text>

  <!-- access -->
  <g>
    <rect x="140" y="80" width="680" height="60" rx="12" fill="#38bdf8" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".28"/>
    <rect x="152" y="72" width="118" height="20" rx="10" fill="#0e1626" stroke="#38bdf8" stroke-opacity=".4"/><text x="211" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Access / Gateway</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="98" width="217" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="258" y="120">Clients PC / APP / H5</text>
      <rect x="381" y="98" width="217" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="489" y="120">OpenResty LB</text>
      <rect x="612" y="98" width="208" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="716" y="120">WAF · Security</text>
    </g>
  </g>
  <line x1="480" y1="140" x2="480" y2="154" stroke="#5b7089" stroke-width="1.6" marker-end="url(#d-ar)"/>

  <!-- services -->
  <g>
    <rect x="140" y="158" width="680" height="60" rx="12" fill="#38bdf8" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".28"/>
    <rect x="152" y="150" width="176" height="20" rx="10" fill="#0e1626" stroke="#38bdf8" stroke-opacity=".4"/><text x="240" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Services · docker-compose</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="176" width="217" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="258" y="198">User Service</text>
      <rect x="381" y="176" width="217" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="489" y="198">Trade Service</text>
      <rect x="612" y="176" width="208" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="716" y="198">Script / Log Service</text>
    </g>
  </g>
  <line x1="480" y1="218" x2="480" y2="232" stroke="#5b7089" stroke-width="1.6" marker-end="url(#d-ar)"/>

  <!-- cache -->
  <g>
    <rect x="140" y="236" width="680" height="56" rx="12" fill="#38bdf8" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".28"/>
    <rect x="152" y="228" width="128" height="20" rx="10" fill="#0e1626" stroke="#38bdf8" stroke-opacity=".4"/><text x="216" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Cache / NoSQL</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="150" y="252" width="333" height="32" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="316" y="273">Redis Cluster</text>
      <rect x="497" y="252" width="323" height="32" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="658" y="273">Memcached</text>
    </g>
  </g>
  <line x1="480" y1="292" x2="480" y2="306" stroke="#5b7089" stroke-width="1.6" marker-end="url(#d-ar)"/>

  <!-- storage -->
  <g>
    <rect x="140" y="310" width="680" height="60" rx="12" fill="#38bdf8" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".28"/>
    <rect x="152" y="302" width="150" height="20" rx="10" fill="#0e1626" stroke="#38bdf8" stroke-opacity=".4"/><text x="227" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">RDBMS · R/W Split</text>
    <g font-size="12.5" fill="#e6edf5" text-anchor="middle">
      <rect x="180" y="328" width="270" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="315" y="350">MySQL Primary (W)</text>
      <rect x="510" y="328" width="270" height="34" rx="8" fill="#0f1a2c" stroke="#ffffff" stroke-opacity=".13"/><text x="645" y="350">MySQL Replica (R)</text>
    </g>
    <line x1="450" y1="345" x2="508" y2="345" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#d-ar-c)"/>
  </g>

  <!-- right: ops rail -->
  <g>
    <rect x="836" y="80" width="146" height="290" rx="12" fill="#0d1622" stroke="#5eead4" stroke-opacity=".32"/>
    <text x="909" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#7fe7d6">Ops / Monitor</text>
    <g font-size="11.5" fill="#cfeee8" text-anchor="middle">
      <rect x="848" y="118" width="122" height="40" rx="8" fill="#101d22" stroke="#5eead4" stroke-opacity=".26"/><text x="909" y="143">Zabbix</text>
      <rect x="848" y="168" width="122" height="40" rx="8" fill="#101d22" stroke="#5eead4" stroke-opacity=".26"/><text x="909" y="193">Grafana</text>
      <rect x="848" y="218" width="122" height="40" rx="8" fill="#101d22" stroke="#5eead4" stroke-opacity=".26"/><text x="909" y="243">GitLab-Runner</text>
      <rect x="848" y="268" width="122" height="40" rx="8" fill="#101d22" stroke="#5eead4" stroke-opacity=".26"/><text x="909" y="293">Logs / Alerts</text>
    </g>
    <text x="909" y="336" text-anchor="middle" font-size="9.5" fill="#7fe7d6">Full-link coverage</text>
  </g>
  <path d="M820 110 H828 q8 0 8 12 V210" fill="none" stroke="#3f6b63" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#d-ar)"/>
</svg>
