<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Mydesign 跨境电商 封面">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12142a"/><stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="80%" cy="12%" r="72%">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="m-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="640" height="300" fill="url(#m-bg)"/>
  <rect width="640" height="300" fill="url(#m-grid)"/>
  <rect width="640" height="300" fill="url(#m-glow)"/>
  <!-- globe -->
  <g transform="translate(196 150)" stroke="#818cf8" fill="none">
    <circle r="96" stroke-opacity=".55" stroke-width="1.6"/>
    <ellipse rx="96" ry="38" stroke-opacity=".32" stroke-width="1.4"/>
    <ellipse rx="52" ry="96" stroke-opacity=".32" stroke-width="1.4"/>
    <ellipse rx="82" ry="96" stroke-opacity=".22" stroke-width="1.2"/>
    <line x1="-96" y1="0" x2="96" y2="0" stroke-opacity=".32" stroke-width="1.4"/>
    <!-- cross-border route -->
    <path d="M-70 40 Q 0 -110 78 -28" stroke="#a5b4fc" stroke-opacity=".9" stroke-width="2.2" stroke-dasharray="5 6"/>
    <circle cx="-70" cy="40" r="5" fill="#818cf8" stroke="none"/>
    <circle cx="78" cy="-28" r="5" fill="#a5b4fc" stroke="none"/>
  </g>
  <!-- recommendation cards / tags -->
  <g transform="translate(392 74)">
    <g fill="#0f1122" stroke="#818cf8" stroke-opacity=".45">
      <rect x="0" y="0" width="150" height="44" rx="8"/>
      <rect x="0" y="58" width="150" height="44" rx="8"/>
      <rect x="0" y="116" width="150" height="44" rx="8"/>
    </g>
    <g fill="#a5b4fc" fill-opacity=".85">
      <rect x="14" y="14" width="70" height="7" rx="3.5"/><rect x="14" y="27" width="46" height="6" rx="3"/>
      <rect x="14" y="72" width="82" height="7" rx="3.5"/><rect x="14" y="85" width="40" height="6" rx="3"/>
      <rect x="14" y="130" width="60" height="7" rx="3.5"/><rect x="14" y="143" width="52" height="6" rx="3"/>
    </g>
    <g fill="#f5b451" font-family="ui-monospace,Menlo,monospace" font-size="11">
      <text x="112" y="27">$</text><text x="112" y="85">$</text><text x="112" y="143">$</text>
    </g>
  </g>
  <text x="40" y="40" fill="#a5b4fc" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">CROSS-BORDER · RECSYS</text>
</svg>
